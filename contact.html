<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="HectorDaniel" />
    <title>Daniel Ibarra | Portafolio Website Project</title>
   
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="styles_1.css" />
    
</head>

<body>
    <main class="container">

        <header class="header">
            <div class="logo">
                <h1>Daniel Ibarra | Portafolio Website Project</h1>
            </div>

            <nav class="nav">
                <a href="index.html">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
            </nav>

            <figure class="logo-top-right">
                <a href="https://www.behance.net/ddanielibarr" target="_blank" rel="noopener noreferrer">
                    <img src="img/D_Logo_C.png" alt="Logo" />
                </a>
            </figure>
        </header>

        <main id="container">

            <section class="contact-card">

                <h2>Contact Me</h2>

                <p>Have a project in mind? Send me a message and I'll get back to you.</p>

                <form action="https://formspree.io/f/mgaworpj" method="POST">

                    <label for="name">Name</label>
                    <input 
                        type="text"
                        id="name"
                        name="name"
                        required
                    />

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    />

                    <label for="phone">Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                    />

                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        maxlength="500"
                        required
                    ></textarea>

                    <button type="submit">Send Message</button>

                </form>

            </section>

        </main>
       

    </main>      

</body>
</html>
